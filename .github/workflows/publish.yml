name: Auto-publish on npm registry if version is new

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing (OIDC) vyžaduje npm 11.5.1 nebo novější
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm test --if-present

      - name: Determine version
        id: v
        run: echo "ver=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Skip if version already on npm
        id: exists
        continue-on-error: true
        run: npm view @pslib/console-app@${{ steps.v.outputs.ver }} version

      - name: Dry-run pack
        if: steps.exists.outcome == 'failure'
        run: npm pack --dry-run

      # Publikuje se přes npm trusted publishing (OIDC), bez NPM_TOKEN.
      # Provenance se v tomto režimu generuje automaticky.
      - name: Publish
        if: steps.exists.outcome == 'failure'
        run: npm publish --access public

      - name: Info
        if: steps.exists.outcome == 'success'
        run: echo "Version ${{ steps.v.outputs.ver }} already published. Skipping."
